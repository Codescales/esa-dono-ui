services:
  dono-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    image: ghcr.io/codescales/esa-dono-ui/backend:latest
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/data/dono.db
      # Tiltify integration
      - TILTIFY_CLIENT_ID=${TILTIFY_CLIENT_ID:-}
      - TILTIFY_CLIENT_SECRET=${TILTIFY_CLIENT_SECRET:-}
      - TILTIFY_CAMPAIGN_ID=${TILTIFY_CAMPAIGN_ID:-}
      - TILTIFY_DONATE_ID=${TILTIFY_DONATE_ID:-}
      - TILTIFY_DONATE_URL=${TILTIFY_DONATE_URL:-}
      - TILTIFY_WEBHOOK_RELAY_ID=${TILTIFY_WEBHOOK_RELAY_ID:-}
      - TILTIFY_WEBHOOK_SECRET=${TILTIFY_WEBHOOK_SECRET:-}
      # Auth
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      - MODERATOR_EMAILS=${MODERATOR_EMAILS:-}
      # Email (magic links). Omit SMTP_HOST to log links to stdout instead.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-Donation Platform <no-reply@example.com>}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
    volumes:
      - dono-data:/data
    restart: unless-stopped

  dono-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/codescales/esa-dono-ui/frontend:latest
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    depends_on:
      - dono-backend
    restart: unless-stopped

volumes:
  dono-data:
