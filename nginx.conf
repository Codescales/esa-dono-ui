# nginx config for the esa-dono-ui SPA.
# Serves the built Vite app and proxies /api to the backend service.
# Listens on 8080 to run as the non-root nginx user (nginx-unprivileged image).

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API + webhooks -> backend service (compose/k8s service name: backend).
    # Dynamic resolution via the container's own DNS (templated at startup),
    # so this works on both Docker (127.0.0.11) and Podman (aardvark-dns) and
    # nginx starts even before the backend is ready.
    location /api/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $backend_upstream "http://backend:3001";
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Tiltify webhooks can carry larger bodies; give them room
        client_max_body_size 2m;
        proxy_read_timeout   60s;
    }

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: everything else serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
