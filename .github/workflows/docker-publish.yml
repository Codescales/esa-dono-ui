name: Build and Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/codescales/esa-dono-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "backend_tags=${{ env.IMAGE_PREFIX }}/backend:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "frontend_tags=${{ env.IMAGE_PREFIX }}/frontend:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "push_enabled=true" >> "$GITHUB_OUTPUT"
            echo "trivy_backend_ref=${{ env.IMAGE_PREFIX }}/backend:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "trivy_frontend_ref=${{ env.IMAGE_PREFIX }}/frontend:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "backend_tags=${{ env.IMAGE_PREFIX }}/backend:latest,${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "frontend_tags=${{ env.IMAGE_PREFIX }}/frontend:latest,${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "push_enabled=true" >> "$GITHUB_OUTPUT"
            echo "trivy_backend_ref=${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "trivy_frontend_ref=${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.tags.outputs.push_enabled }}
          tags: ${{ steps.tags.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.trivy_backend_ref }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          trivyignores: .trivyignore

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.tags.outputs.push_enabled }}
          tags: ${{ steps.tags.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.trivy_frontend_ref }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          trivyignores: .trivyignore

      - name: Smoke-test published images
        if: github.event_name != 'pull_request'
        env:
          ADMIN_API_KEY: smoke-test-key
          FRONTEND_PORT: '18080'
        run: |
          docker pull "${IMAGE_PREFIX}/backend:latest"
          docker pull "${IMAGE_PREFIX}/frontend:latest"
          ./scripts/smoke-test.sh
